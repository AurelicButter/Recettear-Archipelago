name: Unit Tests
on: [push, pull_request, workflow_dispatch]

env:
  ARCHIPELAGO_VERSION: '0.6.7'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.ARCHIPELAGO_VERSION }}
      - uses: actions/checkout@v7.0.1
        with:
          path: worlds/recettear

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.12
          enable-cache: true

      - name: Setup Archipelago
        run: |
          find ./worlds -mindepth 1 -maxdepth 1 -type d -regextype posix-extended ! -regex '.*/(recettear|generic|alttp|apquest)' -exec rm -rf {} \;
          uv venv
          uv pip install pip pytest pytest-subtests pytest-xdist
          find -name requirements.txt | xargs -n1 uv pip install -r
          uv run python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          uv run python Launcher.py --update_settings

      - name: Run Unit Tests
        run: uv run pytest test/general worlds/recettear